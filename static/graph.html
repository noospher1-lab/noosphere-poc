<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Noosphere — Argument Graph</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
<style>
  /* Одна палитра с деревом обсуждений (index.html): мягче чистого чёрного,
     Inter для текста и JetBrains Mono для чисел и меток. Раньше здесь была
     своя, более «терминальная» схема — из-за неё две страницы одного продукта
     выглядели как два разных. */
  :root {
    --bg: #0e1016;
    --panel: #161922;
    --panel2: #1d212c;
    --line: #272c39;
    --line2: #333a49;
    --ivory: #edeef2;
    --dim: #9aa0b0;
    --dim2: #6f7688;
    --bronze: #e0b878;
    --green: #5fd18f;
    --red: #ec6b66;
    --orange: #e8a04e;
    --blue: #66b0ea;
    --violet: #bf98ff;
    --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
    --header-h: 49px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden;
    font-family: var(--sans); color: var(--ivory); }
  a { color: var(--blue); text-decoration: none; }
  a:hover { text-decoration: underline; }
  /* Канвас начинается под шапкой, а не с самого верха окна. */
  #app { position: fixed; top: var(--header-h); left: 0; right: 0; bottom: 0; }

  /* ---- шапка: тот же блок, что в дереве обсуждений ---- */
  header {
    position: fixed; top: 0; left: 0; right: 0; height: var(--header-h); z-index: 20;
    display: flex; align-items: center; gap: 14px;
    padding: 11px 18px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  #logoCanvas { width: 30px; height: 30px; display: block; flex: none; }
  .header-word { font-family: var(--mono); font-weight: 500; letter-spacing: .24em;
    font-size: 14px; text-transform: uppercase; }
  .header-word .noo { color: var(--blue); }
  .header-word .sphere { color: var(--bronze); }
  header .tagline { color: var(--dim2); font-size: 13px; }
  header .spacer { flex: 1; }
  header a { font-size: 13px; color: var(--dim); }
  header a:hover { color: var(--blue); }
  header .muted { color: var(--dim); font-size: 13px; }
  @media (max-width: 760px) { header .tagline { display: none; } }
  canvas { display: block; }

  /* ---- edge labels (CSS overlay, billboarded via JS) ---- */
  .edge-label {
    position: absolute; transform: translate(-50%, -50%);
    font-family: var(--mono); font-size: 9px; letter-spacing: 0.12em;
    padding: 1px 5px; border-radius: 2px; pointer-events: none;
    background: rgba(5,6,10,0.72); white-space: nowrap; opacity: 0; transition: opacity .3s;
  }
  .edge-label.show { opacity: 0.9; }
  .rel-SUPPORTS  { color: var(--green);  border: 1px solid rgba(87,217,138,0.35); }
  .rel-REBUTS    { color: var(--red);    border: 1px solid rgba(226,91,86,0.35); }
  .rel-UNDERCUTS { color: var(--orange); border: 1px solid rgba(226,147,63,0.35); }
  .rel-QUALIFIES { color: var(--blue);   border: 1px solid rgba(90,169,230,0.35); }

  /* ---- node labels (short thesis; full text in HUD on click) ---- */
  .node-label {
    position: absolute; transform: translate(-50%, -50%);
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.06em;
    color: var(--ivory); padding: 2px 7px; border-radius: 3px;
    background: rgba(5,6,10,0.62); border: 1px solid rgba(216,175,110,0.22);
    pointer-events: none; white-space: nowrap; max-width: 230px;
    overflow: hidden; text-overflow: ellipsis;
    opacity: 0; transition: opacity .3s;
  }
  .node-label.show { opacity: 0.92; }
  .node-label.prop {
    color: var(--bronze); font-size: 11px; letter-spacing: 0.14em;
    text-transform: uppercase; border-color: rgba(216,175,110,0.45);
  }

  /* ---- time-axis phase markers ---- */
  .axis-label {
    position: absolute; transform: translate(-50%, -50%);
    font-family: var(--mono); font-size: 9px; letter-spacing: 0.22em;
    text-transform: uppercase; color: #6b6658; pointer-events: none;
    white-space: nowrap; opacity: 0; transition: opacity .3s;
  }
  .axis-label.show { opacity: 0.82; }
  .axis-label.g { color: #6f8bff; }
  .axis-label.c { color: #b98cff; }

  /* ---- variant switcher ---- */
  #variants {
    position: fixed; top: calc(var(--header-h) + 12px); left: 50%; transform: translateX(-50%);
    display: flex; gap: 6px; z-index: 5;
    font-family: var(--mono);
  }
  #variants button {
    font-family: var(--sans); font-size: 12px;
    color: var(--dim); background: var(--panel2); cursor: pointer;
    border: 1px solid var(--line2); border-radius: 6px;
    padding: 6px 11px; transition: border-color .12s, background .12s, color .12s;
  }
  #variants button:hover { color: var(--ivory); border-color: var(--bronze); }
  #variants button.active { color: var(--bronze); background: #2a2110; border-color: var(--bronze); font-weight: 600; }

  /* ---- topic (discussion) switcher — stub for the future topics menu ---- */
  #topics {
    position: fixed; top: calc(var(--header-h) + 12px); left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 8px; z-index: 5; font-family: var(--mono);
  }
  #topics .lbl { font-size: 13px; color: var(--dim2); }
  #topics select {
    font-family: var(--sans); font-size: 13px;
    color: var(--ivory); background: var(--panel2); cursor: pointer;
    border: 1px solid var(--line2); border-radius: 6px; padding: 6px 10px;
  }

  /* ---- HUD panel ---- */
  #hud {
    position: fixed; top: calc(var(--header-h) + 12px); right: 18px; width: 300px; max-width: calc(100vw - 36px);
    font-family: var(--sans); color: var(--ivory);
    background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px;
    padding: 16px 18px 14px;
    transform: translateX(calc(100% + 30px)); transition: transform .35s cubic-bezier(.2,.8,.2,1);
  }
  #hud.open { transform: translateX(0); }
  #hud .eyebrow { font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em;
    color: var(--dim2); text-transform: uppercase; font-weight: 600; }
  #hud h1 { font-size: 17px; line-height: 1.35; margin: 6px 0 10px; font-weight: 600; }
  #hud .body { font-size: 14px; line-height: 1.6; color: var(--dim); margin-bottom: 14px;
    max-height: 56vh; overflow-y: auto; white-space: pre-wrap; padding-right: 4px; }
  #hud .body::-webkit-scrollbar { width: 6px; }
  #hud .body::-webkit-scrollbar-thumb { background: rgba(216,175,110,0.3); border-radius: 3px; }
  #hud .meter { margin-bottom: 10px; }
  #hud .meter .row { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; }
  #hud .meter .row .k { color: var(--dim2); }
  #hud .meter .row .v { color: var(--ivory); font-family: var(--mono); font-variant-numeric: tabular-nums; }
  #hud .track { height: 7px; background: var(--panel2); border-radius: 4px; overflow: hidden; }
  #hud .fill { height: 100%; width: 0; background: var(--bronze); transition: width .5s ease; }
  #hud .fill.poi.up { background: var(--green); }
  #hud .fill.poi.down { background: var(--red); }
  .close { position: absolute; top: 10px; right: 12px; cursor: pointer; color: var(--dim2); font-size: 15px; line-height: 1; }
  .close:hover { color: var(--ivory); }

  /* ---- reactions (PoI-weighted votes on a node) ---- */
  #hud-reactions { border-top: 1px solid rgba(216,175,110,0.18); margin-top: 12px; padding-top: 10px; }
  .rx-head { font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--bronze); margin-bottom: 8px; }
  .rx-head span { color: #c4bfb2; letter-spacing: 0; text-transform: none; }
  .rx-act { display: flex; gap: 6px; align-items: center; margin-bottom: 10px; }
  .rx-act select { flex: 1; font-family: var(--mono); font-size: 10px; color: var(--ivory);
    background: rgba(5,6,10,0.6); border: 1px solid rgba(216,175,110,0.22); border-radius: 3px; padding: 5px; }
  .rx-btn { font-family: var(--mono); font-size: 10px; cursor: pointer; border-radius: 3px;
    padding: 5px 7px; border: 1px solid; background: transparent; }
  .rx-btn.agree { color: var(--green); border-color: rgba(87,217,138,0.4); }
  .rx-btn.agree:hover { background: rgba(87,217,138,0.15); }
  .rx-btn.disagree { color: var(--red); border-color: rgba(226,91,86,0.4); }
  .rx-btn.disagree:hover { background: rgba(226,91,86,0.15); }
  .rx-row { display: flex; align-items: center; gap: 6px; font-size: 9px; margin-bottom: 3px; }
  .rx-row .lab { width: 44px; color: #8a8576; text-align: right; font-variant-numeric: tabular-nums; }
  .rx-row .bars { flex: 1; display: flex; gap: 2px; align-items: center; }
  .rx-row .bar { height: 8px; border-radius: 1px; }
  .rx-row .bar.a { background: var(--green); }
  .rx-row .bar.d { background: var(--red); }
  .rx-row .cnt { color: #c4bfb2; font-variant-numeric: tabular-nums; min-width: 28px; }
  .rx-empty { font-size: 9px; color: #6b6658; }

  /* ---- legend / title ---- */


  #legend {
    position: fixed; bottom: 16px; left: 20px; font-family: var(--mono);
    font-size: 9px; letter-spacing: 0.1em; color: #8a8576; display: flex; gap: 14px; flex-wrap: wrap;
  }
  #legend span { display: inline-flex; align-items: center; gap: 6px; }
  #legend i { width: 14px; height: 2px; display: inline-block; }

  #feed {
    position: fixed; bottom: 16px; right: 18px; width: 300px; max-width: calc(100vw - 36px);
    font-family: var(--mono); font-size: 9.5px; color: #8a8576; text-align: right;
    pointer-events: none;
  }
  #feed .line { opacity: 0; animation: feedin 4s ease forwards; }
  @keyframes feedin { 0%{opacity:0; transform:translateY(4px);} 12%{opacity:.95;} 70%{opacity:.95;} 100%{opacity:0;} }
  .tag-SUPPORTS { color: var(--green); } .tag-REBUTS { color: var(--red); }
  .tag-UNDERCUTS { color: var(--orange); } .tag-QUALIFIES { color: var(--blue); }

  /* ---- left toolbar + slide-in panels (add argument / test) ---- */
  #tools {
    position: fixed; top: calc(var(--header-h) + 58px); left: 20px; z-index: 6;
    display: flex; flex-direction: column; gap: 6px; font-family: var(--mono);
  }
  #tools button {
    font-family: var(--sans); font-size: 12px;
    color: var(--dim); background: var(--panel2); cursor: pointer;
    border: 1px solid var(--line2); border-radius: 6px;
    padding: 7px 12px; transition: border-color .12s, background .12s, color .12s; text-align: left;
  }
  #tools button:hover { color: var(--ivory); border-color: var(--bronze); }
  #tools button.active { color: var(--bronze); background: #2a2110; border-color: var(--bronze); font-weight: 600; }

  .panel {
    position: fixed; top: calc(var(--header-h) + 58px); left: 132px; width: 290px; max-width: calc(100vw - 152px);
    max-height: calc(100vh - var(--header-h) - 96px); overflow-y: auto;
    font-family: var(--sans); color: var(--ivory); z-index: 6;
    background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px;
    padding: 16px 18px;
    transform: translateX(-12px); opacity: 0; pointer-events: none; transition: all .3s;
  }
  .panel.open { transform: translateX(0); opacity: 1; pointer-events: auto; }
  .panel h2 { font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em;
    color: var(--dim2); text-transform: uppercase; margin: 0 0 12px; font-weight: 600; }
  .panel h3 { font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em;
    color: var(--dim2); text-transform: uppercase; margin: 16px 0 8px; font-weight: 600; }
  .panel label { display: block; font-size: 12px; color: var(--dim);
    margin: 10px 0 4px; }
  .panel textarea, .panel select, .panel input[type=text], .panel input[type=number] {
    width: 100%; font-family: var(--sans); font-size: 14px; color: var(--ivory);
    background: var(--panel2); border: 1px solid var(--line2);
    border-radius: 6px; padding: 8px 10px; box-sizing: border-box;
  }
  .panel textarea { resize: vertical; min-height: 64px; }
  .panel .seg { display: flex; gap: 4px; margin-top: 4px; }
  .panel .seg button {
    flex: 1; font-family: var(--sans); font-size: 12px;
    color: var(--dim); background: var(--panel2); cursor: pointer;
    border: 1px solid var(--line2); border-radius: 6px; padding: 7px 4px;
    transition: border-color .12s, background .12s, color .12s;
  }
  .panel .seg button.active { color: var(--bronze); background: #2a2110;
    border-color: var(--bronze); font-weight: 600; }
  .panel .primary {
    width: 100%; margin-top: 14px; font-family: var(--sans); font-size: 14px;
    color: var(--bronze); background: #2a2110; cursor: pointer; font-weight: 600;
    border: 1px solid var(--bronze); border-radius: 6px; padding: 10px;
    transition: background .12s;
  }
  .panel .primary:hover:not(:disabled) { background: #342815; }
  .panel .primary:disabled { opacity: 0.5; cursor: default; }
  .panel .hint { font-size: 12px; color: var(--dim2); margin-top: 8px; line-height: 1.55; }
  .panel .status { font-size: 12px; margin-top: 8px; min-height: 15px; }
  .panel .status.err { color: var(--red); }
  .panel .status.ok { color: var(--green); }
  .panel .status.busy { color: var(--bronze); }

  /* persona rows */
  .author-row { margin-bottom: 10px; }
  .author-row .top { display: flex; justify-content: space-between; align-items: center; font-size: 10px; }
  .author-row .top .nm { display: inline-flex; align-items: center; gap: 6px; }
  .author-row .top .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .author-row .top .rep { color: var(--bronze); font-variant-numeric: tabular-nums; }
  .author-row input[type=range] { width: 100%; margin-top: 4px; accent-color: var(--bronze); }

  /* weights table */
  .wrow { display: flex; justify-content: space-between; gap: 8px; font-size: 10px;
    padding: 3px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
  .wrow .t { color: #c4bfb2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wrow .w { color: var(--bronze); font-variant-numeric: tabular-nums; flex: none; }
  .wrow .a { color: #6b6658; flex: none; }

  @media (max-width: 620px) {
    #hud { top: auto; bottom: 70px; right: 12px; left: 12px; width: auto; }
    #feed { display: none; }
    .panel { left: 12px; right: 12px; width: auto; }
  }
  /* ---- pools mode: thin status bar (pools render as graph nodes) ---- */
  #poolspanel {
    position: fixed; top: 46px; left: 50%; transform: translateX(-50%); z-index: 7;
    display: none; align-items: center; gap: 10px; font-family: var(--mono);
    background: rgba(5,6,10,0.9); border: 1px solid rgba(216,175,110,0.28);
    border-radius: 4px; backdrop-filter: blur(6px); padding: 6px 12px;
  }
  #poolspanel.open { display: flex; }
  #poolspanel h2 { font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--bronze); margin: 0; font-weight: 500; }
  #poolspanel .ph { display: contents; }
  #poolspanel button { font-family: var(--mono); font-size: 9px; color: #8a8576; cursor: pointer;
    background: rgba(12,14,20,0.82); border: 1px solid rgba(216,175,110,0.22); border-radius: 3px; padding: 4px 8px; }
  #poolspanel button:hover { color: var(--ivory); border-color: rgba(216,175,110,0.4); }
  #pools-list { display: none; }

  @media (prefers-reduced-motion: reduce) { #feed .line { animation-duration: 6s; } }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
  <div id="app"></div>

  <header>
    <canvas id="logoCanvas" width="88" height="88" aria-hidden="true"></canvas>
    <span class="header-word"><span class="noo">NOO</span><span class="sphere">SPHERE</span></span>
    <span class="tagline">граф аргументов</span>
    <span class="spacer"></span>
    <a href="/" title="Дерево обсуждений — основной режим чтения">← Дерево</a>
    <a href="/dialogue.html" title="Разговор с ИИ по одному вопросу">Тренажёр ▸</a>
    <a href="/profile.html" title="Мой кабинет — вклад в граф и остаток на счёте">Кабинет ▸</a>
  </header>

  <div id="topics">
    <span class="lbl">Обсуждение</span>
    <select id="topicsel"></select>
  </div>

  <div id="hud">
    <span class="close" id="hud-close">✕</span>
    <div class="eyebrow" id="hud-type">node</div>
    <h1 id="hud-label">—</h1>
    <div class="body" id="hud-content"></div>
    <div class="meter">
      <div class="row"><span class="k">PoI score</span><span class="v" id="hud-poi">0.00</span></div>
      <div class="track"><div class="fill poi" id="hud-poi-fill"></div></div>
    </div>
    <div class="meter">
      <div class="row"><span class="k">Автор</span><span class="v" id="hud-author">—</span></div>
    </div>
    <div id="hud-reactions">
      <div class="rx-head">Реакции <span id="rx-summary"></span></div>
      <div class="rx-act">
        <button id="rx-agree" class="rx-btn agree">👍 За</button>
        <button id="rx-disagree" class="rx-btn disagree">👎 Против</button>
      </div>
      <div id="rx-hist"></div>
    </div>
    <button id="hud-reply" style="width:100%;margin-top:12px;font-family:var(--mono);font-size:11px;letter-spacing:0.1em;color:#05060a;background:var(--bronze);cursor:pointer;border:none;border-radius:3px;padding:9px">↳ Ответить на этот узел</button>
  </div>

  <div id="legend">
    <span><i style="background:var(--green)"></i>за / поток</span>
    <span><i style="background:var(--red)"></i>возражение</span>
    <span><i style="background:var(--blue)"></i>уточнение</span>
    <span style="opacity:.7">← → двигаться по времени · ЛКМ — узел</span>
  </div>

  <div id="feed"></div>

  <!-- left toolbar -->
  <!-- «Новая тема» убрана: граф показывает ОДНУ выбранную тему; темы создаются
       в дереве. Панель ниже открывается только для ответа/действия из HUD. -->
  <div id="tools">
    <button id="tab-pools">Пулы (ИИ)</button>
  </div>

  <!-- Новая тема. Только корень: «ответ на узел» отсюда убран — на графе не
       видно, к какому именно узлу прикрепляется ответ, и выбор читался как
       вопрос без ответа. Отвечать на конкретный узел можно из HUD («ответить
       на этот узел») и из дерева обсуждений, где родитель виден. -->
  <div id="addpanel" class="panel">
    <span class="close" id="add-close">✕</span>
    <h2 id="arg-h2">Ответ на узел</h2>
    <label>Текст</label>
    <textarea id="arg-text" placeholder="Сформулируй ответ…"></textarea>

    <!-- Тип связи нужен только когда отвечаешь на конкретный узел из HUD:
         там цель названа по имени, в отличие от прежнего «ответ на узел». -->
    <div id="arg-reply-opts" style="display:none">
      <label>Тип связи</label>
      <div class="seg" id="arg-rel">
        <button data-rel="support" class="active">за</button>
        <button data-rel="refute">против</button>
        <button data-rel="qualify">уточнение</button>
        <button data-rel="question">вопрос</button>
      </div>
    </div>

    <button id="arg-submit" class="primary">Оценить и добавить</button>
    <div class="status" id="arg-status"></div>
    <div class="hint" id="arg-hint">PoI ставит ИИ по качеству проработки довода.
      Автор — твой аккаунт.</div>
  </div>

  <!-- pools (Layer 2): AI-composed positions for the user-facing reading view -->
  <div id="poolspanel">
    <div class="ph">
      <h2>Пулы позиций · <span id="pools-topic" style="color:#c4bfb2;letter-spacing:0;text-transform:none"></span></h2>
      <div>
        <button id="pools-refresh">↻ Пересчитать</button>
        <button id="pools-close">✕ К графу</button>
      </div>
    </div>
    <div id="pools-list"></div>
  </div>

  <script type="module" src="./app.js"></script>
<script src="/logo.js"></script>
</body>
</html>
