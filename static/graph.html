<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Noosphere — граф</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
<style>
  /* Плоский граф (vault: decisions/2026-09-15-flat-graph). Палитра — та же, что
     в дереве. Здесь нет ни одной анимации, перехода или свечения: картинка
     стоит, пока её не тронул человек. Поэтому и логотип без вращения. */
  :root {
    --bg: #0e1016; --panel: #161922; --panel2: #1d212c;
    --line: #272c39; --line2: #333a49;
    --ivory: #edeef2; --dim: #9aa0b0; --dim2: #6f7688;
    --bronze: #e0b878; --green: #5fd18f; --red: #ec6b66; --orange: #e8a04e;
    --blue: #66b0ea; --violet: #bf98ff; --teal: #7fd8cc;
    --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  }
  * { box-sizing: border-box; }
  /* легенда и панель прячутся атрибутом hidden — он не должен проигрывать display:flex */
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ivory);
    font-family: var(--sans); overflow: hidden; }
  body { display: flex; flex-direction: column; }
  a { color: var(--blue); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button { font: inherit; }

  header { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 14px;
    padding: 11px 18px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .home:hover { text-decoration: none; opacity: .82; }
  .header-word { font-family: var(--mono); font-weight: 500; letter-spacing: .24em; font-size: 14px; }
  .header-word .noo { color: var(--blue); }
  .header-word .sphere { color: var(--bronze); }
  header .tagline { color: var(--dim2); font-size: 13px; }
  header .spacer { flex: 1; }
  header nav a { font-size: 13px; color: var(--dim); margin-left: 14px; }
  header nav a:hover { color: var(--blue); }
  @media (max-width: 760px) { header .tagline { display: none; } }

  .bar { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px;
    padding: 8px 18px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--dim); }
  #crumbs { flex: 1; min-width: 0; line-height: 1.5; }
  #crumbs .here { color: var(--ivory); font-weight: 600; }
  #crumbs .totree { margin-left: 6px; }
  .tools { display: flex; gap: 6px; }
  .tools button { background: var(--panel2); color: var(--dim); border: 1px solid var(--line2);
    border-radius: 5px; padding: 3px 10px; cursor: pointer; }
  .tools button:hover { color: var(--ivory); border-color: var(--dim2); }
  /* на узком экране заголовок ветки — во всю ширину, кнопки строкой ниже */
  @media (max-width: 700px) { #crumbs { flex-basis: 100%; } }

  main { position: relative; flex: 1; min-height: 0; }
  #canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; touch-action: none; }
  #canvas:active { cursor: grabbing; }

  /* ---- текст внутри SVG ---- */
  #canvas text { font-family: var(--sans); }
  .msg { fill: var(--dim); font-size: 15px; }
  .section { fill: var(--dim2); font-size: 12px; letter-spacing: .04em; }
  .tag { font-size: 11px; font-weight: 500; }
  .tag.kind { fill: var(--bronze); text-transform: lowercase; }
  .ptitle { fill: var(--ivory); font-size: 14px; font-weight: 600; }
  .nlabel { fill: #d8dae2; font-size: 12.5px; font-weight: 500; }
  .poi { fill: var(--dim2); font-size: 11px; font-family: var(--mono) !important; }
  .dim, .chip.dim { fill: var(--dim2); }
  .chip { font-size: 11px; font-weight: 500; }
  .chip.unanswered, .flag-unanswered { fill: var(--red); }
  .chip.open, .flag-open { fill: var(--violet); }
  .chip.holds, .flag-holds { fill: var(--green); }
  .flag-concede { fill: var(--bronze); }

  /* ---- карточки ---- */
  .pcard, .ncard { cursor: pointer; outline: none; }
  .pbox { fill: var(--panel); stroke: var(--line2); stroke-width: 1.2; }
  .pbox.other { fill: var(--bg); stroke-dasharray: 4 3; }
  .pcard:hover .pbox, .ncard:hover .nbox { stroke: var(--dim); }
  .pcard:focus-visible .pbox, .ncard:focus-visible .nbox { stroke: var(--ivory); stroke-width: 2; }

  .nbox { fill: var(--panel); stroke: var(--line2); stroke-width: 1.2; }
  .ncard.root .nbox { fill: var(--panel2); stroke: var(--bronze); }
  /* подсветка: у каждой отметки свой цвет и своя заливка */
  .ncard.hl-unanswered .nbox { fill: rgba(236,107,102,.15); stroke: var(--red); }
  .ncard.hl-open .nbox       { fill: rgba(191,152,255,.15); stroke: var(--violet); }
  .ncard.hl-holds .nbox      { fill: rgba(95,209,143,.13); stroke: var(--green); }
  .ncard.concede .nbox       { stroke-dasharray: 6 4; }
  .ncard.concede:not(.hl-unanswered):not(.hl-open):not(.hl-holds) .nbox {
    fill: rgba(224,184,120,.10); stroke: var(--bronze); }
  .ncard.retracted { opacity: .5; }
  .ncard.sel .nbox { stroke: var(--ivory); stroke-width: 2.4; }

  /* ---- линии ---- */
  .edge { fill: none; stroke-width: 1.6; stroke: var(--dim2); }
  .edge.retracted { stroke-dasharray: 4 4; opacity: .5; }
  .rel-support { stroke: var(--green); fill: var(--green); }
  .rel-refute { stroke: var(--red); fill: var(--red); }
  .rel-undercut { stroke: var(--orange); fill: var(--orange); }
  .rel-qualify { stroke: var(--blue); fill: var(--blue); }
  .rel-restate { stroke: var(--dim); fill: var(--dim); stroke-dasharray: 2 3; }
  .rel-question { stroke: var(--violet); fill: var(--violet); }
  .rel-proposal { stroke: var(--teal); fill: var(--teal); }
  .rel-exploration, .rel-atom, .rel-none { stroke: var(--dim2); fill: var(--dim); }
  text.tag[class*="rel-"] { stroke: none; }
  .plink { fill: none; stroke: var(--bronze); stroke-width: 1.8; }
  .plink.v-weakened { stroke-dasharray: 6 4; }
  .plink.v-shaken { stroke: var(--red); stroke-dasharray: 3 4; }
  #arrow path { fill: var(--bronze); }

  /* ---- панель узла ---- */
  #panel { position: absolute; top: 12px; right: 12px; bottom: 12px; width: 380px; max-width: calc(100% - 24px);
    background: var(--panel); border: 1px solid var(--line2); border-radius: 10px;
    padding: 16px 18px; overflow-y: auto; font-size: 14px; line-height: 1.5; }
  #panel-close { position: absolute; top: 8px; right: 10px; background: none; border: none;
    color: var(--dim); font-size: 18px; cursor: pointer; }
  .eyebrow { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--bronze); margin-bottom: 8px; }
  .ptext { white-space: pre-wrap; color: var(--ivory); margin-bottom: 10px; }
  .pmeta { color: var(--dim); font-size: 13px; margin: 6px 0; }
  .pmeta b.v-holds { color: var(--green); } .pmeta b.v-weakened { color: var(--bronze); }
  .pmeta b.v-shaken { color: var(--red); } .pmeta b.v-untested { color: var(--dim); }
  .pnote { font-size: 13px; margin: 8px 0; padding: 6px 10px; border-radius: 6px; border-left: 3px solid var(--line2); background: var(--panel2); }
  .pnote.concede { border-color: var(--bronze); }
  .pnote.open { border-color: var(--violet); }
  .pnote.unanswered { border-color: var(--red); }
  .pbtn { display: inline-block; margin-top: 12px; padding: 7px 12px; border-radius: 6px;
    background: var(--bronze); color: #14161c; font-weight: 600; font-size: 13px; }
  .pbtn:hover { text-decoration: none; opacity: .9; }
  @media (max-width: 700px) {
    #panel { top: auto; left: 8px; right: 8px; bottom: 8px; width: auto; max-height: 55%; }
  }

  /* ---- легенда ---- */
  .legend { position: absolute; left: 12px; bottom: 12px; max-width: calc(100% - 24px);
    background: rgba(22,25,34,.94); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 12px; font-size: 12px; color: var(--dim); display: flex; flex-wrap: wrap; gap: 4px 14px; }
  .legend .sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 5px; border: 1.5px solid; }
  .legend .ln { display: inline-block; width: 16px; height: 0; border-top: 2px solid; vertical-align: 3px; margin-right: 5px; }
  .legend .grp { color: var(--dim2); }
</style>
</head>
<body>
  <header>
    <a class="home" href="/" title="На главную">
      <span class="header-word"><span class="noo">NOO</span><span class="sphere">SPHERE</span></span>
    </a>
    <span class="tagline">граф</span>
    <span class="spacer"></span>
    <nav>
      <a href="/" title="Дерево обсуждений — читать и отвечать">← Дерево</a>
      <a href="/values.html" title="Живой список ценностей и кандидаты в новые">Ценности ▸</a>
      <a href="/dialogue.html" title="Разговор с ИИ по одному вопросу">Тренажёр ▸</a>
      <a href="/profile.html" title="Мой кабинет — вклад в граф и остаток на счёте">Кабинет ▸</a>
    </nav>
  </header>

  <div class="bar">
    <div id="crumbs"></div>
    <div class="tools">
      <button id="zoom-out" title="отдалить">−</button>
      <button id="zoom-in" title="приблизить">+</button>
      <button id="zoom-fit" title="вписать в окно">вписать</button>
      <button id="reload" title="загрузить заново — сам граф не обновляется, чтобы ничего не двигалось">обновить</button>
    </div>
  </div>

  <main>
    <svg id="canvas" aria-label="граф обсуждений">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" />
        </marker>
      </defs>
    </svg>

    <div class="legend" id="legend-map" hidden>
      <span><span class="ln" style="border-color:var(--bronze)"></span>порождает (стрелка к следствию)</span>
      <span><span class="ln" style="border-color:var(--bronze);border-top-style:dashed"></span>связь ослаблена</span>
      <span class="grp">в карточке:</span>
      <span style="color:var(--red)">без ответа</span>
      <span style="color:var(--violet)">открытых вопросов</span>
      <span style="color:var(--green)">держатся</span>
    </div>

    <div class="legend" id="legend-topic" hidden>
      <span class="grp">подсветка:</span>
      <span><span class="sw" style="background:rgba(236,107,102,.15);border-color:var(--red)"></span>возражение без ответа</span>
      <span><span class="sw" style="background:rgba(191,152,255,.15);border-color:var(--violet)"></span>открытый вопрос</span>
      <span><span class="sw" style="background:rgba(95,209,143,.13);border-color:var(--green)"></span>держится</span>
      <span><span class="sw" style="background:rgba(224,184,120,.10);border-color:var(--bronze);border-style:dashed"></span>признаёт</span>
      <span class="grp">линия:</span>
      <span><span class="ln" style="border-color:var(--green)"></span>за</span>
      <span><span class="ln" style="border-color:var(--red)"></span>против</span>
      <span><span class="ln" style="border-color:var(--orange)"></span>не доказывает</span>
      <span><span class="ln" style="border-color:var(--blue)"></span>уточнение</span>
      <span><span class="ln" style="border-color:var(--dim);border-top-style:dotted"></span>пересказ</span>
      <span><span class="ln" style="border-color:var(--violet)"></span>вопрос</span>
      <span><span class="ln" style="border-color:var(--teal)"></span>предложение</span>
    </div>

    <aside id="panel" hidden>
      <button id="panel-close" title="закрыть (Esc)">✕</button>
      <div id="panel-body"></div>
    </aside>
  </main>

  <script src="/graph.js"></script>
</body>
</html>
