<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Noosphere — статистика</title>
<link rel="stylesheet" href="/tokens.css" />
<style>
  :root { --bg:#05060a; --panel:#0b0d14; --panel2:#10131d; --line:#1e2230; --ivory:#ece6d8; --dim:#8a8f9e; --bronze:#d8af6e; --green:#57d98a; --red:#e25b56; --blue:#5aa9e6; --violet:#b98cff; --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace; }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; background:var(--bg); color:var(--ivory);
    font-family:var(--mono); font-size:13px; }
  a { color:var(--blue); text-decoration:none; }
  a:hover { text-decoration:underline; }
  /* переносится, а не уезжает за край: на телефоне ссылки в правой части
     иначе выталкивают страницу в горизонтальную прокрутку */
  header { display:flex; align-items:center; flex-wrap:wrap; gap:8px 14px;
    padding:10px 16px; border-bottom:1px solid var(--line); background:var(--panel);
    position:sticky; top:0; z-index:5; }
  header .brand { font-weight:600; letter-spacing:.08em; color:var(--bronze); }
  header .spacer { flex:1; }
  .muted { color:var(--dim); }
  main { max-width:1080px; margin:0 auto; padding:20px 20px 80px; }

  .section-title { color:var(--dim); letter-spacing:.08em; text-transform:uppercase;
    font-size:10px; margin:26px 0 10px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px;
    padding:14px 16px; }

  /* плитки */
  .tiles { display:grid; gap:10px;
    grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); }
  .tile { background:var(--panel); border:1px solid var(--line); border-radius:8px;
    padding:14px 16px; }
  .tile .k { color:var(--dim); font-size:10px; text-transform:uppercase;
    letter-spacing:.08em; }
  .tile .v { font-size:34px; font-weight:700; line-height:1.15; margin-top:6px;
    font-variant-numeric:tabular-nums; }
  .tile .sub { color:var(--dim); font-size:11px; margin-top:2px; }
  .tile.hero .v { color:var(--bronze); }
  .tile.live .v { color:var(--green); }
  .dot { display:inline-block; width:7px; height:7px; border-radius:50%;
    background:var(--green); margin-right:6px; vertical-align:middle; }
  .dot.off { background:var(--dim); }

  table { width:100%; border-collapse:collapse; }
  th { text-align:left; color:var(--dim); font-weight:400; font-size:10px;
    text-transform:uppercase; letter-spacing:.06em; padding:0 10px 8px 0;
    border-bottom:1px solid var(--line); }
  td { padding:8px 10px 8px 0; border-bottom:1px solid var(--line);
    vertical-align:top; }
  tr:last-child td { border-bottom:none; }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  .who { font-weight:600; }
  .yes { color:var(--green); }
  .no  { color:var(--dim); }

  .bar { height:7px; background:var(--panel2); border-radius:4px; overflow:hidden;
    margin:10px 0 6px; display:flex; }
  .bar i { display:block; height:100%; }
  .bar .used { background:var(--bronze); }
  .bar .free { background:#243a2b; }
  .legend { display:flex; gap:16px; color:var(--dim); font-size:11px; }
  .legend b { color:var(--ivory); font-weight:600; }

  .kv { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
    gap:12px 20px; }
  .kv div span { display:block; }
  .kv .k { color:var(--dim); font-size:10px; text-transform:uppercase;
    letter-spacing:.06em; }
  .kv .v { font-size:20px; font-weight:600; margin-top:3px;
    font-variant-numeric:tabular-nums; }

  /* Таблица профилей прокручивается ВНУТРИ карточки — и по горизонтали
     (колонок много), и по вертикали. Так шапка со столбцами остаётся на
     виду: sticky отсчитывается от прокручиваемого предка, а не от окна,
     и без собственной высоты у контейнера заголовки просто уезжали бы вверх
     вместе со всей карточкой. */
  .scroll { overflow:auto; max-height:70vh; }
  .scroll table { min-width:820px; }
  .scroll th { position:sticky; top:0; background:var(--panel); z-index:2;
    cursor:pointer; user-select:none; white-space:nowrap; }
  .scroll th:hover { color:var(--ivory); }
  .scroll th .arrow { color:var(--bronze); }
  .toolbar { display:flex; align-items:center; gap:12px; margin-bottom:10px; }
  #q { flex:1; max-width:320px; font-family:var(--mono); font-size:12px;
    color:var(--ivory); background:var(--panel2); border:1px solid var(--line);
    border-radius:6px; padding:6px 9px; }
  #q:focus { outline:none; border-color:var(--bronze); }
  .money { color:var(--bronze); }
  .zero { color:var(--dim); }
  .warn { color:var(--red); }
  .tag { font-size:10px; color:var(--violet); border:1px solid #2a1a33;
    border-radius:4px; padding:0 4px; margin-left:5px; }

  .err { color:var(--red); margin:14px 0; }
  .empty { color:var(--dim); padding:18px 0; }
  button { font-family:var(--mono); font-size:12px; color:var(--ivory);
    background:var(--panel2); border:1px solid var(--line); border-radius:6px;
    padding:5px 10px; cursor:pointer; }
  button:hover { border-color:var(--bronze); }
</style>
<script src="/safe.js"></script>
<script src="/antispam.js"></script>
</head>
<body>
<header>
  <a class="brand home" href="/" title="На главную">NOOSPHERE</a>
  <span class="muted">статистика</span>
  <span class="spacer"></span>
  <span class="muted" id="updated"></span>
  <button id="refresh">обновить</button>
  <button id="forget" title="забыть сохранённый ADMIN_TOKEN">выйти</button>
  <a href="/dialogue-admin.html">диалоги ▸</a>
  <a href="/">← к обсуждениям</a>
</header>

<main>
  <div id="error"></div>

  <div class="section-title">люди</div>
  <div class="tiles" id="people"></div>

  <div class="section-title">кто сейчас онлайн</div>
  <div class="card" id="online"></div>

  <div class="section-title">деньги на ИИ</div>
  <div class="tiles" id="money"></div>

  <div class="section-title" id="profilesTitle">все профили</div>
  <div class="card">
    <div class="toolbar">
      <input id="q" placeholder="фильтр: логин, имя или почта" autocomplete="off">
      <span class="muted" id="profilesCount"></span>
    </div>
    <div class="scroll" id="profiles"></div>
  </div>

  <div class="section-title">инвайты</div>
  <div class="card" id="invites"></div>

  <div class="section-title">граф</div>
  <div class="card" id="content"></div>
</main>

<script src="/stats.js"></script>
</body>
</html>
