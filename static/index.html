<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Noosphere — Дерево обсуждений</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    /* softer than pure black — less harsh, reads as a product, not a terminal */
    --bg: #0e1016;
    --panel: #161922;
    --panel2: #1d212c;
    --line: #272c39;
    --line2: #333a49;
    --ivory: #edeef2;
    --dim: #9aa0b0;
    --dim2: #6f7688;
    --bronze: #e0b878;
    --green: #5fd18f;
    --red: #ec6b66;
    --orange: #e8a04e;
    --blue: #66b0ea;
    --violet: #bf98ff;
    --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ivory);
    font-family: var(--sans); font-size: 15px; line-height: 1.5;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  a { color: var(--blue); text-decoration: none; }
  a:hover { text-decoration: underline; }

  header {
    display: flex; align-items: center; gap: 14px;
    padding: 11px 18px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  #logoCanvas { width: 30px; height: 30px; display: block; flex: none; }
  .header-word { font-family: var(--mono); font-weight: 500; letter-spacing: .24em;
    font-size: 14px; text-transform: uppercase; }
  .header-word .noo { color: var(--blue); }
  .header-word .sphere { color: var(--bronze); }
  header .tagline { color: var(--dim2); font-size: 13px; }
  header .spacer { flex: 1; }
  header label { color: var(--dim); }
  header a { font-size: 13px; color: var(--dim); }
  header a:hover { color: var(--blue); }

  select, button, input, textarea {
    font-family: var(--sans); font-size: 13px; color: var(--ivory);
    background: var(--panel2); border: 1px solid var(--line2); border-radius: 6px;
    padding: 6px 10px;
  }
  input::placeholder, textarea::placeholder { color: var(--dim2); }
  button { cursor: pointer; transition: border-color .12s, background .12s; }
  button:hover { border-color: var(--bronze); }
  button.primary { background: #2a2110; border-color: var(--bronze); color: var(--bronze);
    font-weight: 600; }
  button.primary:hover { background: #342815; }
  button.mini { padding: 3px 9px; font-size: 12px; }
  :focus-visible { outline: 2px solid var(--bronze); outline-offset: 1px; }

  #wrap { display: flex; height: calc(100% - 49px); }
  #tree { width: 42%; min-width: 320px; overflow: auto; padding: 12px 8px;
    border-right: 1px solid var(--line); }
  #detail { flex: 1; overflow: auto; padding: 22px 26px; }

  /* ---- tree ---- */
  .row { display: flex; align-items: flex-start; gap: 7px; padding: 4px 7px;
    border-radius: 6px; cursor: pointer; line-height: 1.45; }
  .row:hover { background: var(--panel2); }
  .row.sel { background: #241d0f; outline: 1px solid var(--bronze); }
  .tw { width: 13px; flex: none; color: var(--dim2); text-align: center; user-select: none; }
  .rel { flex: none; font-size: 10.5px; padding: 1px 6px; border-radius: 5px;
    letter-spacing: .02em; font-weight: 500; align-self: center; }
  .rel.support { color: var(--green); border: 1px solid var(--green); }
  .rel.refute  { color: var(--red);   border: 1px solid var(--red); }
  .rel.qualify { color: var(--orange);border: 1px solid var(--orange); }
  .rel.question{ color: var(--blue);  border: 1px solid var(--blue); }
  .rel.root    { color: var(--bronze);border: 1px solid var(--bronze); }
  .txt { flex: 1; min-width: 0; display: -webkit-box; -webkit-box-orient: vertical;
    -webkit-line-clamp: 3; overflow: hidden; }
  .poi { flex: none; color: var(--dim); font-size: 12px; font-family: var(--mono); }
  .poi b { color: var(--ivory); font-weight: 600; }
  .who { flex: none; font-size: 12px; }
  .children { margin-left: 17px; border-left: 1px solid var(--line); padding-left: 5px; }
  .muted { color: var(--dim); }

  /* onboarding legend under the tree header */
  .legend { display: flex; flex-wrap: wrap; gap: 8px; padding: 6px 8px 12px;
    color: var(--dim2); font-size: 12px; border-bottom: 1px solid var(--line);
    margin-bottom: 8px; }
  .legend .rel { cursor: default; }

  /* contextual hints (toggle in header) */
  .hint { background: rgba(224,184,120,.08); border: 1px solid rgba(224,184,120,.32);
    color: #ecd8b0; border-radius: 8px; padding: 9px 12px; font-size: 12.5px;
    line-height: 1.55; margin: 10px 0; }
  .hint b { color: var(--bronze); }
  .hint code { font-family: var(--mono); font-size: 11.5px; color: var(--ivory); }

  /* "how it works" guide shown in the empty detail panel */
  .guide { max-width: 560px; margin: 6px auto; padding: 24px 6px; }
  .guide h3 { color: var(--ivory); font-size: 18px; font-weight: 600; margin: 0 0 4px; }
  .guide .lead { color: var(--dim); margin: 0 0 18px; }
  .guide .step { display: flex; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); }
  .guide .step .n { flex: none; width: 26px; height: 26px; border-radius: 50%;
    border: 1px solid var(--bronze); color: var(--bronze); font-family: var(--mono);
    font-size: 12px; display: flex; align-items: center; justify-content: center; }
  .guide .step .b { color: var(--ivory); font-weight: 600; }
  .guide .step p { margin: 3px 0 0; color: var(--dim); line-height: 1.55; }

  /* empty-state / invitation blocks */
  .empty { max-width: 440px; margin: 8px auto; color: var(--dim);
    text-align: center; padding: 40px 12px; }
  .empty h3 { color: var(--ivory); font-size: 17px; font-weight: 600; margin: 0 0 8px; }
  .empty p { margin: 0 0 14px; line-height: 1.6; }

  /* ---- detail ---- */
  h2 { font-size: 19px; font-weight: 600; margin: 0 0 6px; line-height: 1.35; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 16px 18px; margin-bottom: 15px; }
  .card > div:not(.section-title) { line-height: 1.6; }
  .crit { display: grid; grid-template-columns: 150px 1fr 34px; gap: 7px 12px;
    align-items: center; margin-top: 10px; }
  .bar { height: 7px; background: var(--panel2); border-radius: 4px; overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--bronze); }
  .section-title { color: var(--dim2); letter-spacing: .06em; text-transform: uppercase;
    font-size: 10.5px; font-weight: 600; margin: 2px 0 10px; }
  .meta-poi { font-size: 12px; margin-top: 3px; }
  .buckets { display: flex; gap: 2px; align-items: flex-end; height: 26px; margin-top: 4px; }
  .bk { flex: 1; background: var(--panel2); border-radius: 1.5px 1.5px 0 0; position: relative; min-width: 3px; }
  .bk.agree { background: var(--green); }
  .bk.disagree { background: var(--red); }
  .bklabel { display: flex; gap: 3px; margin-top: 3px; }
  .bklabel span { flex: 1; text-align: center; font-size: 8px; color: var(--dim); }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 11px; font-size: 12px;
    border: 1px solid var(--line2); font-weight: 500; }
  .stance-support { color: var(--green); border-color: var(--green); }
  .stance-oppose  { color: var(--red);  border-color: var(--red); }
  .stance-conclusion { color: var(--violet); border-color: var(--violet); }
  .stance-mixed   { color: var(--dim); }
  .actions { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 12px; }
  textarea { width: 100%; min-height: 56px; resize: vertical; line-height: 1.5; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.62);
    display: flex; align-items: center; justify-content: center; z-index: 10; }
  .modal-card { width: 340px; display: flex; flex-direction: column; gap: 9px; }
  .modal-card input { width: 100%; }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--bronze); color: var(--bronze);
    padding: 9px 16px; border-radius: 8px; opacity: 0; transition: opacity .3s;
    pointer-events: none; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <canvas id="logoCanvas" width="88" height="88" aria-hidden="true"></canvas>
  <span class="header-word"><span class="noo">NOO</span><span class="sphere">SPHERE</span></span>
  <span class="tagline" id="tagline">дерево обсуждений</span>
  <span class="seg" id="viewSeg">
    <b class="seg-i on" data-view="tree">дерево</b>
    <a class="seg-i" data-view="map">карта</a>
  </span>
  <span class="spacer"></span>
  <span id="poiBadge" class="muted"></span>
  <span id="user" class="muted"></span>
  <button id="loginBtn" class="mini">Войти</button>
  <button id="logoutBtn" class="mini" style="display:none">Выйти</button>
  <button id="hintsBtn" class="mini">💡 Подсказки: вкл</button>
  <button id="refresh" class="mini">↻ Обновить</button>
  <button id="newTopic" class="primary mini">+ Новая тема</button>
  <a href="/dialogue.html" title="Разговор с ИИ по одному вопросу — покажет сильные и слабые стороны твоего рассуждения">Тренажёр ▸</a>
  <a href="/profile.html" title="Мой кабинет — вклад в граф и остаток на счёте для работы с ИИ">Кабинет ▸</a>
  <a href="/graph.html" title="Силовой граф — дополнительный режим просмотра">Граф ▸</a>
</header>

<!-- Карта — ВИД внутри той же страницы, а не отдельный экран: иначе переход
     рвёт живое соединение, дублирует вход и разводит формы создания темы. -->
<div id="mapView" style="display:none"></div>

<div id="authModal" class="modal" style="display:none">
  <div class="card modal-card">
    <div class="section-title">Вход или регистрация</div>
    <input id="authUser" placeholder="Логин — латиница, 3–32 символа" autocomplete="username">
    <input id="authPass" type="password" placeholder="Пароль — минимум 6 символов" autocomplete="current-password">
    <input id="authName" placeholder="Имя для отображения — при регистрации">
    <input id="authEmail" type="email" placeholder="Почта — при регистрации, для восстановления доступа" autocomplete="email">
    <input id="authInvite" placeholder="Код приглашения — при регистрации">
    <div class="actions">
      <button id="doLogin" class="primary">Войти</button>
      <button id="doRegister">Создать аккаунт</button>
      <button id="authCancel">Отмена</button>
    </div>
    <div id="authErr" class="muted" style="margin-top:8px"></div>
  </div>
</div>

<div id="wrap">
  <div id="tree"><div class="muted" style="padding:10px">Загрузка…</div></div>
  <div id="detail">
    <div class="empty">
      <h3>Выбери обсуждение слева</h3>
      <p>Каждая ветка — тема. Разворачивай её, чтобы читать аргументы за и против,
         задавать вопросы и добавлять свои.</p>
      <p class="muted">Или начни своё — кнопка «Новая тема» сверху.</p>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>
<link rel="stylesheet" href="/map-ui.css" />
<script src="/logo.js"></script>
<script src="/map-data.js"></script>
<script src="/map-ui.js"></script>
<script src="/map-view.js"></script>
<script src="/tree.js"></script>
</body>
</html>
