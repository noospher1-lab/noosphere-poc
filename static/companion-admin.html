<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noosphere — разговоры с ИИ (dev)</title>
<style>
  :root {
    --bg:#0e1014; --panel:#14171d; --panel2:#191d24; --line:#232833; --line2:#2c3340;
    --ivory:#e8e6e1; --dim:#a3a9b6; --dim2:#6f7688; --bronze:#e0b878;
    --green:#5fd18f; --red:#ec6b66; --blue:#66b0ea; --violet:#bf98ff;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ivory);
    font:14px/1.6 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  header { display:flex; gap:14px; align-items:center; flex-wrap:wrap;
    padding:12px 18px; border-bottom:1px solid var(--line); }
  header h1 { font-size:15px; font-weight:600; margin:0; letter-spacing:.02em; }
  header .sub { color:var(--dim2); font-size:12.5px; }
  header .spacer { flex:1 1 auto; }
  button, select { background:var(--panel2); color:var(--ivory);
    border:1px solid var(--line2); border-radius:7px; padding:5px 11px;
    font-size:12.5px; cursor:pointer; }
  button:hover { border-color:var(--bronze); }
  .wrap { display:flex; min-height:calc(100vh - 52px); }
  #sidebar { width:290px; flex:none; border-right:1px solid var(--line);
    padding:10px; overflow:auto; }
  #main { flex:1 1 auto; padding:16px 20px; overflow:auto; max-width:1000px; }
  .drow { padding:8px 10px; border-radius:8px; cursor:pointer;
    border:1px solid transparent; }
  .drow:hover { background:var(--panel2); }
  .drow.sel { background:var(--panel2); border-color:var(--bronze); }
  .drow .u { font-weight:600; }
  .drow .meta { color:var(--dim2); font-size:12px; }
  .empty { color:var(--dim2); padding:20px; }
  .err { color:var(--red); }
  .entry { border:1px solid var(--line); border-radius:10px; padding:12px 14px;
    margin-bottom:12px; background:var(--panel); }
  .entry-head { display:flex; gap:10px; align-items:center; flex-wrap:wrap;
    color:var(--dim2); font-size:12px; margin-bottom:8px; }
  .kind { font-size:10.5px; padding:1px 7px; border-radius:5px; letter-spacing:.02em; }
  .kind.review { color:var(--bronze); border:1px solid var(--bronze); }
  .kind.companion { color:var(--blue); border:1px solid var(--blue); }
  .kind.precheck { color:var(--violet); border:1px solid var(--violet); }
  .who { color:var(--ivory); font-weight:600; font-size:12.5px; }
  .label { color:var(--dim2); font-size:11px; text-transform:uppercase;
    letter-spacing:.08em; margin:10px 0 3px; }
  .draft { background:var(--panel2); border-left:2px solid var(--line2);
    padding:8px 11px; border-radius:0 7px 7px 0; white-space:pre-wrap; }
  .turn { margin:4px 0; padding:6px 10px; border-radius:7px;
    background:var(--panel2); white-space:pre-wrap; }
  .turn.author { border-left:2px solid var(--green); }
  .turn.companion { border-left:2px solid var(--bronze); }
  .kv { display:flex; gap:8px; flex-wrap:wrap; margin-top:4px; }
  .kv span { font-size:12px; color:var(--dim); background:var(--panel2);
    border:1px solid var(--line2); border-radius:6px; padding:1px 8px; }
  .note { margin-top:6px; }
  .note b { color:var(--bronze); }
  pre.raw { font-family:var(--mono); font-size:11.5px; color:var(--dim);
    white-space:pre-wrap; word-break:break-word; margin:6px 0 0; }
</style>
</head>
<body>
<header>
  <h1>Разговоры с ИИ до публикации</h1>
  <span class="sub">разбор черновика · спор с компаньоном · проверка места</span>
  <span class="spacer"></span>
  <select id="kindFilter">
    <option value="">все виды</option>
    <option value="review">разбор</option>
    <option value="companion">компаньон</option>
    <option value="precheck">проверка места</option>
  </select>
  <button id="reload">обновить</button>
  <a href="/dialogue-admin.html" style="color:var(--dim);font-size:12.5px">тренажёрные диалоги →</a>
</header>
<div class="wrap">
  <div id="sidebar"><div class="empty">загрузка…</div></div>
  <div id="main"><div class="empty">выбери человека слева — или смотри общую ленту</div></div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const $$ = (s) => [...document.querySelectorAll(s)];

// Токен тот же, что у страницы тренажёрных диалогов: один ADMIN_TOKEN сервера.
function getToken() {
  let t = localStorage.getItem("admin_token");
  if (!t) {
    t = prompt("X-Admin-Token (из .env сервера, ADMIN_TOKEN):") || "";
    if (t) localStorage.setItem("admin_token", t);
  }
  return t;
}

async function api(path) {
  const r = await fetch(path, { headers: { "X-Admin-Token": getToken() } });
  if (r.status === 403) localStorage.removeItem("admin_token");
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || String(r.status));
  return r.json();
}

let selectedAuthor = null;   // null = общая лента

function fmtDate(iso) {
  if (!iso) return "";
  return new Date(iso).toLocaleString("ru-RU", { day:"2-digit", month:"2-digit",
    hour:"2-digit", minute:"2-digit", second:"2-digit" });
}

const KIND_RU = { review: "разбор", companion: "компаньон", precheck: "проверка места" };

async function loadAuthors() {
  const box = $("#sidebar");
  try {
    const items = await api("/api/dev/companion/authors");
    box.innerHTML = "";
    const all = document.createElement("div");
    all.className = "drow" + (selectedAuthor === null ? " sel" : "");
    all.innerHTML = '<div class="u">Все, вперемешку</div>'
      + '<div class="meta">общая лента по времени</div>';
    all.onclick = () => { selectedAuthor = null; loadAuthors(); loadFeed(); };
    box.appendChild(all);
    if (!items.length) {
      box.appendChild(Object.assign(document.createElement("div"),
        { className: "empty", textContent: "с ИИ ещё никто не говорил" }));
      return;
    }
    for (const it of items) {
      const row = document.createElement("div");
      row.className = "drow" + (selectedAuthor === it.author_id ? " sel" : "");
      row.innerHTML = '<div class="u"></div><div class="meta"></div>';
      row.querySelector(".u").textContent =
        it.author || it.username || ("#" + it.author_id);
      row.querySelector(".meta").textContent =
        `обращений ${it.entries} · ${fmtDate(it.last_at)}`;
      row.onclick = () => { selectedAuthor = it.author_id; loadAuthors(); loadFeed(); };
      box.appendChild(row);
    }
  } catch (e) {
    box.innerHTML = `<div class="empty err">ошибка: ${e.message}</div>`;
  }
}

function entryCard(e) {
  const card = document.createElement("div");
  card.className = "entry";
  const head = document.createElement("div");
  head.className = "entry-head";
  const k = document.createElement("span");
  k.className = "kind " + e.kind;
  k.textContent = KIND_RU[e.kind] || e.kind;
  head.appendChild(k);
  const who = document.createElement("span");
  who.className = "who";
  who.textContent = e.author || e.username || ("#" + e.author_id);
  head.appendChild(who);
  head.appendChild(Object.assign(document.createElement("span"),
    { textContent: fmtDate(e.created_at) }));
  head.appendChild(Object.assign(document.createElement("span"),
    { textContent: e.connect_to ? ("в ответ на #" + e.connect_to)
                                : ("новый корень" + (e.root_kind ? " · " + e.root_kind : "")) }));
  card.appendChild(head);

  card.appendChild(Object.assign(document.createElement("div"),
    { className: "label", textContent: "черновик на этот ход" }));
  card.appendChild(Object.assign(document.createElement("div"),
    { className: "draft", textContent: e.draft || "—" }));

  const hist = e.history || [];
  if (hist.length) {
    card.appendChild(Object.assign(document.createElement("div"),
      { className: "label", textContent: `разговор до этого хода (${hist.length})` }));
    for (const h of hist) {
      const t = document.createElement("div");
      t.className = "turn " + (h.role === "author" ? "author" : "companion");
      t.textContent = (h.role === "author" ? "человек: " : "ИИ: ") + (h.text || "");
      card.appendChild(t);
    }
  }

  const r = e.result || {};
  card.appendChild(Object.assign(document.createElement("div"),
    { className: "label", textContent: "что ответил ИИ" }));
  // Показываем разобранные поля, а не сырой JSON: смотрят сюда, чтобы понять,
  // где человек споткнулся, а не чтобы читать схему ответа.
  const kv = document.createElement("div");
  kv.className = "kv";
  const flags = [
    r.type_ok === false && ("вид не подошёл → " + (r.suggested_type || "—")),
    r.verdict && r.verdict !== "new" && ("вердикт: " + r.verdict),
    r.placement && r.placement !== "here" && ("место: " + r.placement),
    r.split && "предложил разрезать на два",
  ].filter(Boolean);
  for (const f of flags)
    kv.appendChild(Object.assign(document.createElement("span"), { textContent: f }));
  if (flags.length) card.appendChild(kv);

  for (const [field, label] of [["type_note", "про вид"], ["quality_note", "как усилить"],
                                ["place_note", "про место"], ["note", "про совпадение"],
                                ["think", "вопрос автору"], ["reply", "реплика"],
                                ["suggestion", "предложенная формулировка"]]) {
    const v = r[field];
    if (!v) continue;
    const d = document.createElement("div");
    d.className = "note";
    d.appendChild(Object.assign(document.createElement("b"), { textContent: label + ": " }));
    d.appendChild(document.createTextNode(String(v)));
    card.appendChild(d);
  }
  if (!flags.length && !Object.keys(r).some((k) => r[k] && typeof r[k] === "string"))
    card.appendChild(Object.assign(document.createElement("div"),
      { className: "empty", textContent: "замечаний не было" }));
  return card;
}

async function loadFeed() {
  const main = $("#main");
  main.innerHTML = '<div class="empty">загрузка…</div>';
  const kind = $("#kindFilter").value;
  const q = new URLSearchParams({ limit: "300" });
  if (selectedAuthor !== null) q.set("author_id", String(selectedAuthor));
  try {
    let items = await api("/api/dev/companion?" + q.toString());
    if (kind) items = items.filter((e) => e.kind === kind);
    main.innerHTML = "";
    if (!items.length) {
      main.innerHTML = '<div class="empty">ничего нет</div>';
      return;
    }
    for (const e of items) main.appendChild(entryCard(e));
  } catch (e) {
    main.innerHTML = `<div class="empty err">ошибка: ${e.message}</div>`;
  }
}

$("#reload").onclick = () => { loadAuthors(); loadFeed(); };
$("#kindFilter").onchange = loadFeed;
loadAuthors();
loadFeed();
</script>
</body>
</html>
