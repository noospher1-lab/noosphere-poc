<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noosphere — разговоры с ИИ (dev)</title>
<link rel="stylesheet" href="/tokens.css" />
<style>
  :root { --bg:#0e1014; --panel:#14171d; --panel2:#191d24; --line:#232833; --line2:#2c3340; --ivory:#e8e6e1; --dim:#a3a9b6; --mono:ui-monospace, SFMono-Regular, Menlo, monospace; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ivory);
    font:14px/1.6 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  header { display:flex; gap:14px; align-items:center; flex-wrap:wrap;
    padding:12px 18px; border-bottom:1px solid var(--line); }
  header h1 { font-size:15px; font-weight:600; margin:0; letter-spacing:.02em; }
  header .sub { color:var(--dim2); font-size:12.5px; }
  header .spacer { flex:1 1 auto; }
  button, select { background:var(--panel2); color:var(--ivory);
    border:1px solid var(--line2); border-radius:7px; padding:5px 11px;
    font-size:12.5px; cursor:pointer; }
  button:hover { border-color:var(--bronze); }
  .wrap { display:flex; min-height:calc(100vh - 52px); }
  #sidebar { width:290px; flex:none; border-right:1px solid var(--line);
    padding:10px; overflow:auto; }
  #main { flex:1 1 auto; padding:16px 20px; overflow:auto; max-width:1000px; }
  .drow { padding:8px 10px; border-radius:8px; cursor:pointer;
    border:1px solid transparent; }
  .drow:hover { background:var(--panel2); }
  .drow.sel { background:var(--panel2); border-color:var(--bronze); }
  .drow .u { font-weight:600; }
  .drow .meta { color:var(--dim2); font-size:12px; }
  .empty { color:var(--dim2); padding:20px; }
  .err { color:var(--red); }
  .entry { border:1px solid var(--line); border-radius:10px; padding:12px 14px;
    margin-bottom:12px; background:var(--panel); }
  .entry-head { display:flex; gap:10px; align-items:center; flex-wrap:wrap;
    color:var(--dim2); font-size:12px; margin-bottom:8px; }
  .kind { font-size:10.5px; padding:1px 7px; border-radius:5px; letter-spacing:.02em; }
  .kind.review { color:var(--bronze); border:1px solid var(--bronze); }
  .kind.companion { color:var(--blue); border:1px solid var(--blue); }
  .kind.precheck { color:var(--violet); border:1px solid var(--violet); }
  .who { color:var(--ivory); font-weight:600; font-size:12.5px; }
  .label { color:var(--dim2); font-size:11px; text-transform:uppercase;
    letter-spacing:.08em; margin:10px 0 3px; }
  .draft { background:var(--panel2); border-left:2px solid var(--line2);
    padding:8px 11px; border-radius:0 7px 7px 0; white-space:pre-wrap; }
  .turn { margin:4px 0; padding:6px 10px; border-radius:7px;
    background:var(--panel2); white-space:pre-wrap; }
  .turn.author { border-left:2px solid var(--green); }
  .turn.companion { border-left:2px solid var(--bronze); }
  .kv { display:flex; gap:8px; flex-wrap:wrap; margin-top:4px; }
  .kv span { font-size:12px; color:var(--dim); background:var(--panel2);
    border:1px solid var(--line2); border-radius:6px; padding:1px 8px; }
  .note { margin-top:6px; }
  .note b { color:var(--bronze); }
  pre.raw { font-family:var(--mono); font-size:11.5px; color:var(--dim);
    white-space:pre-wrap; word-break:break-word; margin:6px 0 0; }
</style>
</head>
<body>
<header>
  <h1>Разговоры с ИИ до публикации</h1>
  <span class="sub">разбор черновика · спор с компаньоном · проверка места</span>
  <span class="spacer"></span>
  <select id="kindFilter">
    <option value="">все виды</option>
    <option value="review">разбор</option>
    <option value="companion">компаньон</option>
    <option value="precheck">проверка места</option>
  </select>
  <button id="reload">обновить</button>
  <a href="/dialogue-admin.html" style="color:var(--dim);font-size:12.5px">тренажёрные диалоги →</a>
</header>
<div class="wrap">
  <div id="sidebar"><div class="empty">загрузка…</div></div>
  <div id="main"><div class="empty">выбери человека слева — или смотри общую ленту</div></div>
</div>

<script src="/safe.js"></script>
<script src="/companion-admin.js"></script>
</body>
</html>
